spring.application.name=auth-rbac-backend
server.port=8080

# Database Configuration (MySQL default with environment variable overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_rbac_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e5a1b7c9f8e2d4c6a8b0d2e4f6a8c0d2e4f6a8b0c2d4e6f8a0b2c4d}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
